# G_fixed generation rules — paper Sec. 4.2. Decoding/backbone live in configs/models.yaml (g_fixed).
# TBD convention: see configs/models.yaml header.

g_fixed:
  # One rewrite state per x0; no multi-candidate selection (LOCKED, paper Sec. 4.2).
  states_per_x0: 1

  # Invalid output -> regenerate with the next seed; give up and drop x0 after this many
  # attempts in total (paper Sec. 4.2). Fixed before the runs.
  max_attempts: 3                   # Decision (2026-09-17): one call plus two
                                    # regenerations, the same budget as the paper Sec. 4.6 parse retries.

  validity:
    # An output is INVALID if any of the following holds (paper Sec. 4.2):
    #   refusal        : provider-level refusal signal OR the output STARTS with one of the
    # refusal prefixes ((c), 2026-09-16; prefix semantics 2026-09-18)
    #   empty          : empty after normalization
    #   identical_to_x0: equal to x0 under the equality rule below
    # non_english: non-Latin letter ratio above threshold (2026-09-16)
    refusal_phrases_file: configs/refusal_phrases.yaml
    # Equality rule ((b), 2026-09-16): strip leading/trailing whitespace and
    # collapse internal whitespace runs to one space; case-sensitive. Same rule is used
    # for the controller's "revised_text == x_t" empty-rewrite check.
    equality: normalized_whitespace
    non_english:
      # Deterministic rule: remove digits, punctuation, emoji; among remaining letters,
      # count those outside the Latin script (accented Latin counts as Latin). Invalid if
      # non_latin / total_letters > threshold. Outputs with zero letters are treated as empty.
      threshold: 0.5                # Decision (2026-09-17). A genuine English rewrite
                                    # sits far below 0.2; 0.5 catches a whole-sentence language
                                    # switch while leaving room for accented Latin.
